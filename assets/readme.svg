<svg xmlns="http://www.w3.org/2000/svg" width="850" height="720" viewBox="0 0 850 720" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Gaikwad engineering profile</title>
  <desc id="desc">A terminal-style profile covering current focus, engineering stack, systems work, and how Aditya uses AI-assisted engineering.</desc>
  <defs>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#4d4d4d"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .label { fill: #a3a3a3; font-size: 12px; letter-spacing: .7px; }
      .muted { fill: #5f5f5f; font-size: 12px; }
      .body { fill: #ededed; font-size: 14px; }
      .small { fill: #a3a3a3; font-size: 12px; }
    </style>
  </defs>
  <rect width="850" height="720" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="849" height="719" fill="none" stroke="#262626"/>

  <text class="mono body" x="24" y="24" font-size="13" font-weight="700">adityagaikwad</text>
  <text class="mono muted" x="826" y="24" text-anchor="end">~/profile</text>
  <line x1="0" y1="37" x2="850" y2="37" stroke="#2a2a2a" stroke-dasharray="4 3"/>

  <g transform="translate(0 37)">
    <text class="mono label" x="24" y="25">WHOAMI</text>
    <text class="mono muted" x="94" y="25">· senior engineer / ai × infrastructure</text>
    <text class="mono" x="24" y="72" fill="#ededed" font-size="31" font-weight="700">Aditya Ravindra Gaikwad</text>
    <text class="mono" x="24" y="105" fill="#a3a3a3" font-size="15">I build dependable systems where AI meets infrastructure.</text>
    <text class="mono" x="24" y="134" fill="#5f5f5f" font-size="12">Currently: AI-assisted operations, automation, and structured data tooling.</text>
    <rect x="24" y="156" width="6" height="6" fill="#ededed"><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
    <text class="mono muted" x="38" y="162">based in the San Francisco Bay Area</text>
  </g>
  <line x1="0" y1="210" x2="850" y2="210" stroke="#2a2a2a" stroke-dasharray="4 3"/>

  <g transform="translate(0 210)">
    <text class="mono label" x="24" y="25">STACK</text>
    <text class="mono muted" x="76" y="25">· tools I reach for</text>
    <line x1="425" y1="0" x2="425" y2="214" stroke="#2a2a2a" stroke-dasharray="4 3"/>

    <text class="mono small" x="24" y="58">LANGUAGES</text>
    <text class="mono body" x="24" y="84">Rust  ·  Python  ·  TypeScript  ·  Go</text>
    <text class="mono small" x="24" y="119">PLATFORMS</text>
    <text class="mono body" x="24" y="145">Kubernetes  ·  AWS  ·  GCP  ·  Terraform</text>
    <text class="mono small" x="24" y="180">SYSTEMS</text>
    <text class="mono body" x="24" y="206">Kafka  ·  PostgreSQL  ·  Redis  ·  Elasticsearch</text>

    <text class="mono label" x="449" y="25">ENGINEERING MODE</text>
    <text class="mono muted" x="449" y="59">AI-assisted, not AI-replaced.</text>
    <text class="mono body" x="449" y="93">structured inputs</text>
    <text class="mono body" x="449" y="122">deterministic tooling</text>
    <text class="mono body" x="449" y="151">tracing + evaluation harnesses</text>
    <text class="mono muted" x="449" y="185">for reliable, reproducible agentic systems</text>
  </g>
  <line x1="0" y1="424" x2="850" y2="424" stroke="#2a2a2a" stroke-dasharray="4 3"/>

  <g transform="translate(0 424)">
    <text class="mono label" x="24" y="25">SYSTEMS LOG</text>
    <text class="mono muted" x="120" y="25">· work I am proud of</text>
    <rect x="24" y="45" width="5" height="5" fill="url(#dots)"/>
    <text class="mono body" x="42" y="52">AI agents for storage-platform operations</text>
    <text class="mono muted" x="42" y="73">routing, structured data, and evals for operational investigations</text>
    <rect x="24" y="102" width="5" height="5" fill="url(#dots)"/>
    <text class="mono body" x="42" y="109">Infrastructure automation and capacity fulfillment</text>
    <text class="mono muted" x="42" y="130">reducing manual work while improving operator confidence</text>
    <rect x="24" y="159" width="5" height="5" fill="url(#dots)"/>
    <text class="mono body" x="42" y="166">Distributed data and search systems</text>
    <text class="mono muted" x="42" y="187">Kubernetes, Kafka, cloud control planes, and large-scale telemetry</text>
    <line x1="425" y1="0" x2="425" y2="214" stroke="#2a2a2a" stroke-dasharray="4 3"/>
    <text class="mono label" x="449" y="25">PROFILE</text>
    <text class="mono small" x="449" y="57">CURRENT ROLE</text>
    <text class="mono body" x="449" y="80">Senior Software Engineer @ Meta</text>
    <text class="mono small" x="449" y="113">BACKGROUND</text>
    <text class="mono body" x="449" y="136">VMware / Broadcom · cloud platforms</text>
    <text class="mono small" x="449" y="169">EDUCATION</text>
    <text class="mono body" x="449" y="192">M.S. Computer Science · Stony Brook</text>
  </g>
  <line x1="0" y1="638" x2="850" y2="638" stroke="#2a2a2a" stroke-dasharray="4 3"/>

  <g transform="translate(0 638)">
    <text class="mono muted" x="24" y="27">pinned repositories below are the public workbench</text>
    <text class="mono muted" x="826" y="27" text-anchor="end">linkedin.com/in/aditya-gaikwad</text>
    <rect x="24" y="51" width="6" height="6" fill="#ededed"><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
    <text class="mono muted" x="38" y="57">profile generated from a deliberately curated set of public facts</text>
  </g>
</svg>
