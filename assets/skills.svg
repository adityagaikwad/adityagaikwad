    .note { fill:#5f5f5f; font-size:12px; }
    .tag text { fill:#ededed; font-size:12px; font-weight:600; text-anchor:middle; }
    .lang rect { fill:#18233a; stroke:#345b8f; }
    .tools rect { fill:#17362f; stroke:#347768; }
    .data rect { fill:#362a1a; stroke:#886331; }
  </style>
